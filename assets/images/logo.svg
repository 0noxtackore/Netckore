<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="net" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7bb3ff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  <!-- Globe -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#net)" stroke-width="6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#net)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="url(#net)" stroke-width="3" opacity="0.4"/>
  <!-- Longitude lines -->
  <ellipse cx="256" cy="256" rx="40" ry="180" fill="none" stroke="url(#net)" stroke-width="2" opacity="0.5"/>
  <ellipse cx="256" cy="256" rx="100" ry="180" fill="none" stroke="url(#net)" stroke-width="2" opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="160" ry="180" fill="none" stroke="url(#net)" stroke-width="2" opacity="0.2"/>
  <!-- Latitude lines -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="url(#net)" stroke-width="2" opacity="0.5"/>
  <line x1="116" y1="136" x2="396" y2="136" stroke="url(#net)" stroke-width="2" opacity="0.3"/>
  <line x1="116" y1="376" x2="396" y2="376" stroke="url(#net)" stroke-width="2" opacity="0.3"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="url(#net)"/>
  <!-- Title -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#7bb3ff">Netckore</text>
</svg>